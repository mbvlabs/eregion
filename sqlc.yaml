version: "2"
sql:
  # Application persistence.
  - engine: postgresql
    schema:
      - internal/dbschema/migrations
      - internal/entities/infrastructure/schema.sql
    queries: internal/entities/queries
    gen:
      go:
        package: query
        out: internal/entities/internal/query
        sql_package: pgx/v5
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int64
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true

  # Application-owned River metadata queries.
  - engine: postgresql
    schema:
      - internal/dbschema/migrations
      - internal/entities/river/schema_pinned.sql
    queries: internal/entities/river/queries.sql
    gen:
      go:
        package: riverquery
        out: internal/entities/internal/riverquery
        sql_package: pgx/v5
        overrides:
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
          - db_type: jsonb
            nullable: true
            go_type:
              import: encoding/json
              type: RawMessage
              pointer: true
          - db_type: pg_catalog.int2
            go_type: int64
          - db_type: pg_catalog.int2
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int64
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true

  # Catalog inspection on Goose's existing database/sql transaction.
  - engine: postgresql
    schema: internal/entities/infrastructure/schema.sql
    queries: internal/entities/queries/infrastructure.sql
    gen:
      go:
        package: infrastructurequery
        out: internal/entities/internal/infrastructurequery
        sql_package: database/sql
        overrides:
          - db_type: pg_catalog.int4
            go_type: int64
