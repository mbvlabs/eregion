name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: go mod download
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: just check
      - run: bin/eregion commands --json
      - run: git diff --exit-code -- go.mod go.sum
  portable-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./cmd/eregion

  integration:
    runs-on: ubuntu-latest
    env:
      EREGION_TEST_REAL_PACK_REGISTRY: 127.0.0.1:5000
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: eregion-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Prepare isolated Pack build prerequisites
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pack.tgz" https://github.com/buildpacks/pack/releases/download/v0.40.9/pack-v0.40.9-linux.tgz
          echo "dc0ee1e931cf8a106d7555a01a214864f9acb60b77adf15d69b74df4404758e9  $RUNNER_TEMP/pack.tgz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/pack.tgz" -C "$RUNNER_TEMP" pack
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          docker run -d --name eregion-registry -p 127.0.0.1:5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker pull paketobuildpacks/builder-jammy-base:latest
      - run: just integration
        env:
          EREGION_TEST_DATABASE_URL: postgres://postgres:eregion-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      - run: just integration-race
        env:
          EREGION_TEST_DATABASE_URL: postgres://postgres:eregion-ci-only@127.0.0.1:5432/postgres?sslmode=disable
