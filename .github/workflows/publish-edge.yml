name: Publish edge

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release configuration
        env:
          EREGION_RELEASE_BUCKET: ${{ vars.EREGION_RELEASE_BUCKET }}
          EREGION_RELEASE_BASE_URL: ${{ vars.EREGION_RELEASE_BASE_URL }}
          EREGION_R2_ENDPOINT: ${{ secrets.EREGION_R2_ENDPOINT }}
          EREGION_R2_ACCESS_KEY_ID: ${{ secrets.EREGION_R2_ACCESS_KEY_ID }}
          EREGION_R2_SECRET_ACCESS_KEY: ${{ secrets.EREGION_R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "${EREGION_RELEASE_BUCKET}" || { echo "EREGION_RELEASE_BUCKET is not configured" >&2; exit 1; }
          test -n "${EREGION_RELEASE_BASE_URL}" || { echo "EREGION_RELEASE_BASE_URL is not configured" >&2; exit 1; }
          test -n "${EREGION_R2_ENDPOINT}" || { echo "EREGION_R2_ENDPOINT is not configured" >&2; exit 1; }
          test -n "${EREGION_R2_ACCESS_KEY_ID}" || { echo "EREGION_R2_ACCESS_KEY_ID is not configured" >&2; exit 1; }
          test -n "${EREGION_R2_SECRET_ACCESS_KEY}" || { echo "EREGION_R2_SECRET_ACCESS_KEY is not configured" >&2; exit 1; }
          grep -Fq "const ReleaseBaseURL = \"${EREGION_RELEASE_BASE_URL}\"" internal/buildinfo/buildinfo.go || {
            echo "EREGION_RELEASE_BASE_URL must equal buildinfo.ReleaseBaseURL" >&2
            exit 1
          }
      - name: Verify source
        run: |
          test -z "$(gofmt -l cmd internal schema examples)"
          go vet ./...
          go build ./...
      - name: Build edge release
        env:
          EREGION_RELEASE_BASE_URL: ${{ vars.EREGION_RELEASE_BASE_URL }}
        run: scripts/build-release.sh "edge-${GITHUB_SHA::12}" edge "${EREGION_RELEASE_BASE_URL}"
      - name: Sign and verify edge release
        run: scripts/sign-release.sh dist/release-edge
      - name: Upload immutable artifacts and channel files
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EREGION_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EREGION_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          EREGION_RELEASE_BUCKET: ${{ vars.EREGION_RELEASE_BUCKET }}
          EREGION_R2_ENDPOINT: ${{ secrets.EREGION_R2_ENDPOINT }}
        run: scripts/upload-release.sh dist/release-edge edge "${EREGION_RELEASE_BUCKET}" "${EREGION_R2_ENDPOINT}"
