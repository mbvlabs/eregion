# The workflow file path is part of the pinned cosign certificate identity.
# Do not rename it: installers and release clients pin
# publish-stable.yml@refs/tags/v<version>.
name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
    steps:
      - id: tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "${REF}" = "refs/tags/${REF_NAME}" || exit 1
          number='(0|[1-9][0-9]*)'
          if [[ "${REF_NAME}" =~ ^v${number}\.${number}\.${number}$ ]]; then
            echo 'kind=final' >> "${GITHUB_OUTPUT}"
          elif [[ "${REF_NAME}" =~ ^v${number}\.${number}\.${number}-(alpha|beta|rc)\.${number}$ ]]; then
            echo 'kind=prerelease' >> "${GITHUB_OUTPUT}"
          else
            echo 'invalid release tag' >&2
            exit 1
          fi
  publish:
    name: Publish stable
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'final' }}
    runs-on: ubuntu-24.04
    environment: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Check pinned AWS CLI conditional writes
        run: bash scripts/check-release-aws.sh
      - name: Validate release configuration
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "${RELEASE_BUCKET}" || { echo "RELEASE_BUCKET is not configured" >&2; exit 1; }
          test -n "${RELEASE_BASE_URL}" || { echo "RELEASE_BASE_URL is not configured" >&2; exit 1; }
          test -n "${R2_ENDPOINT}" || { echo "R2_ENDPOINT is not configured" >&2; exit 1; }
          [[ "${R2_ENDPOINT}" == https://* ]] || { echo "R2_ENDPOINT must use https://" >&2; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "R2_ACCESS_KEY_ID is not configured" >&2; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "R2_SECRET_ACCESS_KEY is not configured" >&2; exit 1; }
          grep -Fq "const ReleaseBaseURL = \"${RELEASE_BASE_URL}\"" internal/buildinfo/buildinfo.go || {
            echo "RELEASE_BASE_URL must equal buildinfo.ReleaseBaseURL" >&2
            exit 1
          }
      - name: Verify tagged source
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "invalid final release tag" >&2; exit 1; }
          test "${GITHUB_REF}" = "refs/tags/v${version}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          major="${version%%.*}"
          # A stable tag is on its own major line, not on master.
          git fetch --no-tags origin "+refs/heads/${major}.x:refs/remotes/origin/${major}.x"
          git fetch --force --tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${major}.x"
          test -z "$(gofmt -l cmd internal schema examples)"
          go vet ./...
          go build ./...
      - name: Build the major line release
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="stable-${version%%.*}.x"
          scripts/build-release.sh "${version}" "${channel}" "${RELEASE_BASE_URL}"
      - name: Sign and verify the tagged release
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="stable-${version%%.*}.x"
          scripts/sign-release.sh "dist/release-${channel}"
      - name: Upload the immutable artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          line="stable-${version%%.*}.x"
          existing="$(aws s3api list-objects-v2 \
            --bucket "${RELEASE_BUCKET}" --prefix "releases/${version}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "${R2_ENDPOINT}")"
          test "${existing}" = 0 || {
            echo "Release ${version} already exists and will not be overwritten" >&2
            exit 1
          }
          scripts/upload-release.sh "dist/release-${line}" "${line}" "${RELEASE_BUCKET}" "${R2_ENDPOINT}" artifacts
      - name: Promote the major line only forward
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          line="${version%%.*}.x"
          go run ./internal/release/cmd/promote --bucket "${RELEASE_BUCKET}" --key "${line}/manifest.json" --endpoint "${R2_ENDPOINT}" --channel "stable-${line}" --root "dist/release-stable-${line}" --version "${version}" --commit "${GITHUB_SHA}"
      - name: Move the root channel when this is the highest version
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_root="dist/release-stable-${version%%.*}.x"
          go run ./internal/release/cmd/promote --bucket "${RELEASE_BUCKET}" --key manifest.json --endpoint "${R2_ENDPOINT}" --channel stable --root "${release_root}" --version "${version}" --commit "${GITHUB_SHA}"
  publish_prerelease:
    name: ${{ contains(github.ref_name, '-rc.') && 'Publish RC' || 'Publish prerelease snapshot' }}
    needs: classify
    if: ${{ needs.classify.outputs.kind == 'prerelease' }}
    runs-on: ubuntu-24.04
    environment: edge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Check pinned AWS CLI conditional writes
        run: bash scripts/check-release-aws.sh
      - name: Require edge bootstrap qualification for alpha and beta
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          EDGE_CHANNEL_BOOTSTRAP_QUALIFIED: ${{ vars.EDGE_CHANNEL_BOOTSTRAP_QUALIFIED }}
        run: |
          [[ "${EDGE_CHANNEL_BOOTSTRAP_QUALIFIED}" =~ ^edge-[0-9a-f]{12}$ ]] || {
            echo "Set EDGE_CHANNEL_BOOTSTRAP_QUALIFIED to the operator-verified edge bootstrap version before publishing alpha or beta." >&2
            exit 1
          }
      - name: Validate release configuration
        env:
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "${RELEASE_BUCKET}" || { echo "RELEASE_BUCKET is not configured" >&2; exit 1; }
          test -n "${RELEASE_BASE_URL}" || { echo "RELEASE_BASE_URL is not configured" >&2; exit 1; }
          test -n "${R2_ENDPOINT}" || { echo "R2_ENDPOINT is not configured" >&2; exit 1; }
          [[ "${R2_ENDPOINT}" == https://* ]] || { echo "R2_ENDPOINT must use https://" >&2; exit 1; }
          test -n "${R2_ACCESS_KEY_ID}" || { echo "R2_ACCESS_KEY_ID is not configured" >&2; exit 1; }
          test -n "${R2_SECRET_ACCESS_KEY}" || { echo "R2_SECRET_ACCESS_KEY is not configured" >&2; exit 1; }
          grep -Fq "const ReleaseBaseURL = \"${RELEASE_BASE_URL}\"" internal/buildinfo/buildinfo.go || {
            echo "RELEASE_BASE_URL must equal buildinfo.ReleaseBaseURL" >&2
            exit 1
          }
      - name: Verify tagged source
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]] || { echo "invalid release tag" >&2; exit 1; }
          test "${GITHUB_REF}" = "refs/tags/v${version}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          major="${version%%.*}"
          # A stable tag is on its own major line, not on master.
          git fetch --no-tags origin "+refs/heads/${major}.x:refs/remotes/origin/${major}.x"
          git fetch --force --tags origin master:refs/remotes/origin/master
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${major}.x"
          test -z "$(gofmt -l cmd internal schema examples)"
          go vet ./...
          go build ./...
      - name: Build the major line release
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel=edge
          [[ "${version}" != *-rc.* ]] || channel=rc
          scripts/build-release.sh "${version}" "${channel}" "${RELEASE_BASE_URL}"
      - name: Sign and verify the tagged release
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel=edge
          [[ "${version}" != *-rc.* ]] || channel=rc
          scripts/sign-release.sh "dist/release-${channel}"
      - name: Upload the immutable artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel=edge
          [[ "${version}" != *-rc.* ]] || channel=rc
          existing="$(aws s3api list-objects-v2 \
            --bucket "${RELEASE_BUCKET}" --prefix "releases/${version}/" --max-keys 1 \
            --query KeyCount --output text --endpoint-url "${R2_ENDPOINT}")"
          test "${existing}" = 0 || {
            echo "Release ${version} already exists and will not be overwritten" >&2
            exit 1
          }
          scripts/upload-release.sh "dist/release-${channel}" "${channel}" "${RELEASE_BUCKET}" "${R2_ENDPOINT}" artifacts
      - name: Promote the opt-in rc channel only forward
        if: contains(github.ref_name, '-rc.')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./internal/release/cmd/promote --channel rc --bucket "${RELEASE_BUCKET}" --key rc/manifest.json --endpoint "${R2_ENDPOINT}" --root dist/release-rc --version "${version}" --commit "${GITHUB_SHA}"
      - name: Promote alpha and beta to edge
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          RELEASE_BUCKET: ${{ vars.RELEASE_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          go run ./internal/release/cmd/promote --channel edge --bucket "${RELEASE_BUCKET}" --key edge/manifest.json --endpoint "${R2_ENDPOINT}" --root dist/release-edge --version "${version}" --commit "${GITHUB_SHA}"
