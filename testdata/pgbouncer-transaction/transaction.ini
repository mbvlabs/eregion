[databases]
eregion = host=postgres port=5432 dbname=eregion

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,search_path,options
